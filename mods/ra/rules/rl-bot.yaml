Player:
	# Phase 1 controlled player: exact same ModularBot modules as normal, plus
	# a private steering/observation condition.  Other bot types never receive
	# enable-agent-steering and therefore cannot load these traits.
	ModularBot@AgentNormalAI:
		Name: Agent Normal AI
		Type: agent-normal
	GrantConditionOnBotOwner@agent-normal-base:
		Condition: enable-normal-ai
		Bots: agent-normal
	GrantConditionOnBotOwner@agent-normal-steering:
		Condition: enable-agent-steering
		Bots: agent-normal
	SteeringModule:
		RequiresCondition: enable-agent-steering
		HeartbeatInterval: 250
	ObservationTrait:
		RequiresCondition: enable-agent-steering
		Port: 9999
		ObservationInterval: 10
	EngineEventDetector:
		RequiresCondition: enable-agent-steering
	CaptureManagerBotModule@agent-mission:
		RequiresCondition: enable-agent-steering
		CapturingActorTypes: e6
		CapturableActorTypes: oilb, hosp, tech, atek, stek
		MinimumCaptureDelay: 375
	ExternalBotBridge@RLAGENT:
		Name: bot-rl-agent.name
		Type: rl-agent
		Port: 9999
		ObservationInterval: 9999
	# The live operator uses agent-normal so the stock normal bot modules and
	# the steering/observation conditions are selected together. Keep the
	# legacy rl-agent entry above for existing headless clients.
	ExternalBotBridge@AGENTNORMAL:
		Name: bot-rl-agent.name
		Type: agent-normal
		Port: 9999
		ObservationInterval: 9999
	ModularBot@DummyAI:
		Name: Dummy (Passive)
		Type: dummy
